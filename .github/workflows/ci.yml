name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest
      - run: uv build
      - name: Smoke test built wheel
        shell: bash
        run: |
          uv venv /tmp/agent-harness-lab-smoke
          uv pip install --python /tmp/agent-harness-lab-smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/agent-harness-lab-smoke/bin/agent-harness-lab --version
          /tmp/agent-harness-lab-smoke/bin/python -m agent_harness_lab --help
